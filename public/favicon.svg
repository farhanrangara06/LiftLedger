<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="96" y1="400" x2="400" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="140" y1="340" x2="390" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Financial Ledger Bars / "L" Monogram Base -->
  <rect x="104" y="296" width="44" height="104" rx="12" fill="url(#blueGrad)" opacity="0.85" />
  <rect x="168" y="248" width="44" height="152" rx="12" fill="url(#blueGrad)" />
  <rect x="232" y="200" width="44" height="200" rx="12" fill="url(#blueGrad)" />

  <!-- Base Chassis / Outrigger Line -->
  <rect x="96" y="384" width="320" height="28" rx="14" fill="url(#blueGrad)" />
  <circle cx="144" cy="404" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="10" />
  <circle cx="288" cy="404" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="10" />

  <!-- Telescopic Boom Arm Rising Upward -->
  <path d="M132 364 L328 148" stroke="url(#amberGrad)" stroke-width="34" stroke-linecap="round" />
  <path d="M268 214 L356 116" stroke="#FDE68A" stroke-width="18" stroke-linecap="round" />

  <!-- Hydraulic Cylinder Accent -->
  <path d="M188 364 L256 232" stroke="#94A3B8" stroke-width="12" stroke-linecap="round" />

  <!-- High-Reach Aerial Work Platform / Basket -->
  <path d="M332 104 H416 V158 C416 169 407 178 396 178 H352 C341 178 332 169 332 158 V104 Z" fill="#0F172A" stroke="url(#amberGrad)" stroke-width="14" stroke-linejoin="round" />
  <line x1="332" y1="132" x2="416" y2="132" stroke="url(#amberGrad)" stroke-width="10" />
  <line x1="374" y1="104" x2="374" y2="178" stroke="url(#amberGrad)" stroke-width="10" />
</svg>
